<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sim Sze Yu GitHub profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="60" x2="1040" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.45 0 0 0 0 1 0 0 0 0.55 0"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #94A3B8; }
      .white { fill: #F8FAFC; }
      .cyan { fill: #67E8F9; }
      .violet { fill: #C4B5FD; }
      .pink { fill: #F9A8D4; }
      .card { fill: rgba(15, 23, 42, 0.82); stroke: rgba(148, 163, 184, 0.22); }
      .line { stroke: rgba(148, 163, 184, 0.22); }
    </style>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="175" cy="105" r="130" fill="#2563EB" opacity="0.24" filter="url(#softGlow)"/>
  <circle cx="1010" cy="310" r="150" fill="#A855F7" opacity="0.22" filter="url(#softGlow)"/>
  <path d="M0 326 C200 250 360 390 590 300 C810 215 940 300 1200 220 V420 H0 V326Z" fill="url(#accent)" opacity="0.10"/>

  <g transform="translate(64 54)">
    <rect width="1072" height="312" rx="26" class="card"/>
    <line x1="0" y1="58" x2="1072" y2="58" class="line"/>
    <circle cx="32" cy="29" r="7" fill="#F87171"/>
    <circle cx="56" cy="29" r="7" fill="#FBBF24"/>
    <circle cx="80" cy="29" r="7" fill="#34D399"/>
    <text x="102" y="35" class="mono muted" font-size="15">szeyu@github: ~/profile</text>

    <text x="48" y="122" class="sans white" font-size="54" font-weight="800">Sim Sze Yu</text>
    <text x="50" y="164" class="sans muted" font-size="24">AI-native builder · Data Engineering · Finance Systems · Agentic Workflows</text>

    <g transform="translate(50 205)">
      <rect width="230" height="44" rx="22" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(103, 232, 249, 0.35)"/>
      <text x="24" y="28" class="sans cyan" font-size="16" font-weight="700">AI Agents</text>

      <rect x="250" width="260" height="44" rx="22" fill="rgba(167, 139, 250, 0.12)" stroke="rgba(196, 181, 253, 0.35)"/>
      <text x="274" y="28" class="sans violet" font-size="16" font-weight="700">Finance Systems</text>

      <rect x="530" width="275" height="44" rx="22" fill="rgba(244, 114, 182, 0.12)" stroke="rgba(249, 168, 212, 0.35)"/>
      <text x="554" y="28" class="sans pink" font-size="16" font-weight="700">Data Infrastructure</text>
    </g>

    <g transform="translate(50 278)">
      <text x="0" y="0" class="mono muted" font-size="17">current_process:</text>
      <text x="170" y="0" class="mono white" font-size="17">Vibe Quant · Claude Code workflows · market/data tools</text>
    </g>
  </g>
</svg>